name: Android CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint, and build debug + release bundle
        run: gradle testDebugUnitTest lintDebug lintRelease assembleDebug bundleRelease --stacktrace
      - name: Verify Android 16 target and artifact size budget
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          max=$((40 * 1024 * 1024))
          test -f "$apk" && test -f "$aab"
          test "$(stat -c%s "$apk")" -lt "$max"
          test "$(stat -c%s "$aab")" -lt "$max"
          target_sdk="$(apkanalyzer manifest target-sdk "$apk")"
          test "$target_sdk" = "36"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: the-guest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: the-guest-release-aab-unsigned-ci
          path: app/build/outputs/bundle/release/app-release.aab
